<!DOCTYPE html>
<html ng-app="taskApp">
<head>
  <meta charset="UTF-8">
  <title>AngularJS Task Manager with Firebase</title>
  
  
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/angularfire@2.3.0/dist/angularfire.min.js"></script>

  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <style>
   
    body {
      font-family: 'Roboto', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color:#f4f4f4;
      margin: 0;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width:700px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    input {
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #0056b3;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
    }

    th {
      background: #007bff;
      color: white;
    }

    td {
      background: white;
    }

    td button {
      margin-right: 5px;
      padding: 5px;
      border-radius: 3px;
    }

    .edit-btn {
      background-color: #28a745;
    }

    .edit-btn:hover {
      background-color: #218838;
    }

    .delete-btn {
      background-color: #dc3545;
    }

    .delete-btn:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body ng-controller="TaskController">
  <app-root></app-root>

  <div class="container">
    <h1>Task Manager</h1>

    <!-- Task Form -->
    <form ng-submit="addTask()">
      <input type="text" ng-model="newTask" placeholder="Enter new task" required>
      <input type="text" ng-model="taskDateTime" placeholder="Enter Date & Time (YYYY-MM-DD HH:MM)" required>
      <button type="submit">Add Task</button>
      <h1>Madan</h1>
      <h1>Madan Testing</h1>
    </form>

   
    <table>
      <thead>
        <tr>
          <th>Task Name</th>
          <th>Date & Time</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="task in tasks">
          <td>
            <span ng-if="!task.editing">{{ task.name }}</span>
            <input type="text" ng-if="task.editing" ng-model="task.name">
          </td>
          <td>
            <span ng-if="!task.editing">{{ task.dateTime }}</span>
            <input type="text" ng-if="task.editing" ng-model="task.dateTime">
          </td>
          <td>
            <button class="edit-btn" ng-click="editTask(task)" ng-if="!task.editing">Edit</button>
            <button class="edit-btn" ng-click="saveTask(task)" ng-if="task.editing">Save</button>
            <button class="delete-btn" ng-click="deleteTask(task)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // Firebase Configuration
    var firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://madan-e63c5-default-rtdb.firebaseio.com/",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

   
    angular.module('taskApp', ['firebase'])
      .controller('TaskController', ['$scope', '$firebaseArray', function($scope, $firebaseArray) {
        var ref = firebase.database().ref().child('tasks');
        $scope.tasks = $firebaseArray(ref);

        // Add Task
        $scope.addTask = function() {
          if ($scope.newTask && $scope.taskDateTime) {
            $scope.tasks.$add({ 
              name: $scope.newTask, 
              dateTime: $scope.taskDateTime 
            }).then(function() {
              $scope.newTask = '';
              $scope.taskDateTime = '';
            });
          }
        };

        // Edit Task
        $scope.editTask = function(task) {
          task.editing = true;
        };

        // Save Task
        $scope.saveTask = function(task) {
          task.editing = false;
          $scope.tasks.$save(task);
        };

       
        $scope.deleteTask = function(task) {
          $scope.tasks.$remove(task);
        };
      }]);
  </script>

</body>
</html>
